[package]
name = "tlab-vehicle-physics"
version = "0.1.0"
edition = "2024"
description = "Pure Rust Pacejka Magic Formula tire friction and drift physics model from TLabVehiclePhysics"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/tlab-vehicle-physics-rs"
keywords = ["pacejka", "tire-model", "vehicle-physics", "drift", "friction"]
categories = ["game-development", "simulation", "science"]

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
approx = "0.5"
